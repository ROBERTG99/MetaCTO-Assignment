# Weekly dependency updates, so known vulnerabilities don't sit unnoticed (the audit runs in CI too).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
